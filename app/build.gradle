plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.bmi'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.bmi.dev"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    // 基础依赖：降级到AGP 7.3.1兼容版本
    implementation 'androidx.appcompat:appcompat:1.6.1' // 原1.7.1降级，避免依赖高版本AGP
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // 原2.2.1降级，适配低AGP
    implementation 'com.google.android.material:material:1.9.0' // 原1.13.0降级，解决Dex错误
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0' // 原1.1.0降级，适配AGP 7.3.1
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1' // 原1.4.0降级，避免版本冲突

    // 测试依赖（默认生成，无需修改）
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}